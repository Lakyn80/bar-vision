[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bar-vision-backend"
version = "0.1.0"
description = "Bar Vision FastAPI backend"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]