services:

  postgres:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    # MinIO scratch-based image has no curl/wget; readiness is verified
    # later by storage integration tests when Phase 9 lands.
    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      DATASETS_ROOT: /datasets
      GLASS_PROFILE_GATE_ENABLED: ${GLASS_PROFILE_GATE_ENABLED:-true}
      GLASS_PROFILE_ONNX_PATH: ${GLASS_PROFILE_ONNX_PATH:-/models/glass_profile/glass_500ml_v1.onnx}
      GLASS_PROFILE_METADATA_PATH: ${GLASS_PROFILE_METADATA_PATH:-/models/glass_profile/glass_500ml_v1.metadata.json}

    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
      - ./models:/models:ro

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "127.0.0.1:${APP_PORT}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
